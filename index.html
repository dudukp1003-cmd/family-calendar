.upd button{border:none;border-radius:16px;background:var(--main);color:var(--onmain);font-weight:800;padding:8px 12px;font-size:13px;white-space:nowrap}
.rx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.rx button{border:1.5px solid var(--line2);background:var(--card);border-radius:14px;padding:2px 8px;font-size:13px;color:var(--ink);min-height:28px}
.rx button.me{border-color:var(--main);background:color-mix(in srgb,var(--main) 12%,transparent)}
.rx .add{color:var(--mute);font-size:12px}
.place{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.place a{font-size:12px;font-weight:700;color:var(--main);border:1.5px solid var(--line2);border-radius:12px;padding:4px 10px;text-decoration:none;background:var(--card)}
.favs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.favs button{border:1.5px solid var(--line2);background:var(--card);border-radius:16px;padding:6px 12px;font-size:14px;color:var(--ink);font-weight:500}
.favs button.x{border-color:var(--danger);color:var(--danger)}
.favs .edit{border:none;background:none;color:var(--main);font-weight:700;font-size:13px;padding:6px 4px}
.lbl{font-size:12px;font-weight:700;color:var(--mute);margin:2px 2px 6px}
.twho{border:none;background:none;font-size:12px;color:var(--main);font-weight:700;padding:4px 6px;white-space:nowrap}
.chips.small{padding:0}.chips.small .chip{height:34px;font-size:13px;padding:0 10px}
.sel{-webkit-appearance:none;appearance:none;width:100%;height:52px;border-radius:16px;border:2px solid var(--line2);background-color:var(--card);color:var(--ink);font-size:16px;font-weight:600;padding:0 44px 0 16px;font-family:inherit;
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
.sel:focus{outline:none;border-color:var(--main)}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fonts button{border:2px solid var(--line2);background:var(--card);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);min-height:62px}
.fonts button b{font-size:19px;font-weight:400;line-height:1.2}.fonts button small{font-size:11px;color:var(--mute);font-family:'Noto Sans KR',sans-serif}
.fonts button.on{border-color:var(--main);box-shadow:0 0 0 2px var(--main) inset}
.cat{margin-right:3px}
.cal .ds{height:12px;align-items:center}.cal .ds em{font-style:normal;font-size:10px;line-height:12px}
[data-fs=big] .two{grid-template-columns:1fr}
[data-fs=big] header.top .peek{display:none}
[data-fs=big] header.top h1{font-size:21px;overflow:hidden;text-overflow:ellipsis}
[data-fs=big] .themes,[data-fs=big] .fonts{grid-template-columns:repeat(2,minmax(0,1fr))}
</style>

  /* ── 화면 그리기 ── */
  var app = document.getElementById('app');

  function renderTabs() {

  /* ── 새 소식: 다른 가족이 일정·댓글을 바꾸면 숫자로 표시 ── */

  }
  function markSeen() { var top = news()[0]; if (top) store('fc_seen', top.at); newsBadge(); }
  /* ── 일정 검색: 제목·메모·누구 ── */
  function renderSearch() {
    return '<div class="subtop"><button data-act="searchback" aria-label="뒤로">' + ic('left', 22, 'var(--ink)', 2.2) + '</button><h1 class="jua">일정 검색</h1><span></span></div>' +

      '<main style="padding-top:8px"><div id="hits"></div></main>';

  function hl(t, q) {

    }).join('') : '<div class="empty">찾는 일정이 없어요</div>') + '</div></section>';

    var dd = events().filter(function (e) { return e.dday === 'Y' && visible(e); })
      .map(function (e) { return { e: e, d: nextOcc(e, td) }; }).filter(function (x) { return x.d; })
      .sort(function (a, b) { return a.d < b.d ? -1 : 1; }).slice(0, 2);

  function renderCal() {

      var d = new Date(start); d.setDate(start.getDate() + i);

    }

      var lb = BRIEFS.filter(function (b) { return b[0] === r.brief; })[0];
      toast(r.brief === 'N' ? '브리핑을 껐어요' : r.brief === 'E21:00' ? '전날 밤 9시에 내일 일정을 알려 드려요' : (lb ? lb[1] : '') + '에 오늘 일정을 알려 드려요');
    }).catch(function (e) { store('fc_brief', before); render(true); fail(e); });
  });

  document.addEventListener('submit', function (ev) {
    var id = ev.target.id;
    if (id === 'reqform') {
      ev.preventDefault();
      S.reqMemo = document.getElementById('r_memo').value.trim();
      S.reqName = document.getElementById('r_name').value.replace(/[,<>"'=+@\-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 10);
      if (!S.reqName) { toast('내 이름을 적어 주세요.'); return; }
      if (S.reqName === '가족' || S.reqName === '전체') { toast('\'' + S.reqName + '\'은(는) 이름으로 쓸 수 없어요.'); return; }
      if (S.reqMemo.replace(/\s/g, '').length < 2) { toast('어떤 기기로 신청하는지 적어 주세요.'); return; }
      call('apiRequest', S.code, S.dev, S.reqName, uaText(), S.reqMemo, S.reqKind, S.reqColor).then(function (r) {
        if (r.status === 'Y') return load();
        if (r.status === 'N') { forget(false); S.stage = ''; render(); toast('이 기기는 사용이 막혀 있어요.'); return; }
        S.stage = 'wait'; render(); toast('승인 요청을 보냈어요');
      }).catch(fail);
      return;
    }
    if (id === 'cform') {
      ev.preventDefault();
      var inp = document.getElementById('c_text'), text = inp.value.trim();
      if (!text) return;
      var evId = S.detail;
      if (/^tmp/.test(evId)) { toast('일정 저장이 끝나면 댓글을 달 수 있어요.'); return; }
      inp.value = ''; S.toBottom = true;
      quick(function (D) { D.comments.push({ id: tmpId(), eventId: evId, name: S.me, text: text, at: nowStamp(), mine: true }); }, 'apiAddComment', [S.code, S.dev, evId, text],
        function () { setTimeout(function () { var i2 = document.getElementById('c_text'); if (i2 && !i2.value) i2.value = text; }, 0); });
      return;
    }
    if (id === 'favform') {
      ev.preventDefault();
      var fv = document.getElementById('fav_text'), ft = fv.value.trim();
      if (!ft) return;
      if (((S.data && S.data.favs) || []).some(function (f) { return f.kind === S.todoKind && f.text === ft; })) { toast('이미 있어요'); return; }
      fv.value = '';
      quick(function () {}, 'favAdd', [S.code, S.dev, S.todoKind, ft]);
      return;
    }
    if (id === 'todoform') {
      ev.preventDefault();
      var t = document.getElementById('t_text'), tx = t.value.trim();
      if (!tx) return;
      var tk = S.todoKind;
      quick(function (D) { D.todos.push({ id: tmpId(), kind: tk, text: tx, who: S.todoWho || '', done: false, by: S.me, at: nowStamp() }); }, 'apiSaveTodo', [S.code, S.dev, { kind: tk, text: tx, who: S.todoWho || '' }]);
      var i2 = document.getElementById('t_text'); if (i2) i2.focus();
    }
  });

  // 다시 화면에 돌아오면(1분 지났을 때) 새로 불러오기, 일정 화면을 보고 있으면 30초마다 댓글 새로고침
  // 새 버전이 오면 위에 띠를 띄워서 한 번 누르면 바로 적용
  try {
    if (navigator.serviceWorker) {
      var hadCtl = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadCtl) { hadCtl = true; return; }
        if (document.getElementById('upd')) return;
        var bar = document.createElement('div'); bar.id = 'upd'; bar.className = 'upd'; bar.setAttribute('role', 'status');
        bar.innerHTML = '새 버전이 준비됐어요<button data-act="reload">지금 적용</button>';
        document.body.appendChild(bar);
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); });
      });
    }
  } catch (e) {}

  // 앱을 열면 알림 목록에 쌓인 우리 앱 알림을 지움 → 갤럭시 아이콘 숫자도 함께 사라짐
  function clearNotis() {
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(function (reg) {
        if (reg && reg.getNotifications) reg.getNotifications().then(function (ns) { ns.forEach(function (n) { n.close(); }); });
      });
    } catch (e) {}
  }
  clearNotis();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') clearNotis();
    if (document.visibilityState === 'visible' && S.code && S.data && Date.now() - S.lastLoad > 60000 && S.view !== 'edit') load(true);
  });
  // 바뀐 게 있는지 가볍게 확인: 일정(댓글) 화면은 4초, 다른 화면은 20초마다. 바뀌었을 때만 새로 받아 옴
  var lastPing = 0, pinging = false;
  setInterval(function () {
    if (FB || document.visibilityState !== 'visible' || !S.code || !S.data || pinging || pending || S.view === 'edit') return;
    var gap = S.view === 'detail' ? 4000 : 20000;
    if (Date.now() - lastPing < gap || Date.now() - S.lastLoad < gap) return;
    lastPing = Date.now(); pinging = true;
    callQuiet('apiPing', S.code, S.dev).then(function (r) {
      pinging = false;
      if (r && r.rev && S.data && r.rev !== S.data.rev) load(true);
    }, function (e) { pinging = false; authFail(e); });
  }, 1000);

  render();
  if (S.code) load(true);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
