<!DOCTYPE html>
<html lang="ko">
<head>
<title>우리가족 캘린더</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F7A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root,[data-theme=dino]{--bg:#FFF8EC;--card:#FFFFFF;--ink:#2B2A33;--mute:#5F5B66;--sub:#4A4652;--faint:#B8B2A7;--line:#F1E6CF;--line2:#E9DCC1;--dash:#F3EAD8;--main:#2F7A4A;--main2:#225C37;--onmain:#FFFFFF;--sun:#C2410C;--sat:#2F6FDB;--yellow:#FFE08A;--accInk:#4A3A10;--accInk2:#6B4E00;--hill:#CDEBC4;--danger:#B42318;--badge:#E5484D;--hfont:'Jua','Noto Sans KR',sans-serif;--hweight:400}
[data-theme=sea]{--bg:#EEF6FB;--card:#FFFFFF;--ink:#1D2A36;--mute:#566575;--sub:#3E4D5C;--faint:#A9B6C2;--line:#D6E7F2;--line2:#C3DAEA;--dash:#E1EEF6;--main:#1F6FA8;--main2:#155280;--yellow:#D7ECFA;--accInk:#173B57;--accInk2:#1F5E8C;--hill:#BFE3F5;--sun:#C2410C;--sat:#1F6FA8}
[data-theme=berry]{--bg:#FFF4F6;--card:#FFFFFF;--ink:#33232A;--mute:#6B5560;--sub:#55414B;--faint:#C7B2BA;--line:#F7DCE4;--line2:#EFC9D5;--dash:#FBE6EC;--main:#C93D6F;--main2:#9E2C55;--yellow:#FFE0EA;--accInk:#5C1F36;--accInk2:#9E2C55;--hill:#FFD3DF;--sun:#C93D6F;--sat:#2F6FDB}
[data-theme=night]{--bg:#12161E;--card:#1C222D;--ink:#ECEFF4;--mute:#A9B2C0;--sub:#C4CBD6;--faint:#5C6677;--line:#2A3240;--line2:#384254;--dash:#2A3240;--main:#4FB37C;--main2:#2E7D52;--onmain:#0E1A12;--yellow:#2C2A1C;--accInk:#F2E3A8;--accInk2:#FFD966;--hill:#1F3A2B;--sun:#FF8A65;--sat:#7FB2FF;--danger:#FF8A80;--badge:#FF6B6B}
[data-theme=clean]{--bg:#F6F7F9;--card:#FFFFFF;--ink:#1C2430;--mute:#5B6573;--sub:#3E4754;--faint:#B5BCC7;--line:#E3E8EF;--line2:#D5DCE6;--dash:#EEF1F5;--main:#2F5DA8;--main2:#22457E;--yellow:#EEF2F8;--accInk:#1C2430;--accInk2:#2F5DA8;--hill:#E3E8EF;--sun:#C2410C;--sat:#2F5DA8;--hfont:'Noto Sans KR',sans-serif;--hweight:800}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif}
button,input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
.jua{font-family:var(--hfont);font-weight:var(--hweight)}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{padding:22px 20px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.top small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.top h1{margin:0;font-size:27px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:2px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn.plain{border:none;background:transparent}
.chips{display:flex;gap:6px;padding:8px 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 12px 0 5px;border-radius:20px;border:2px solid var(--line2);background:var(--card);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip.all{padding:0 16px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
main{flex:1;padding:0 16px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.dday{background:var(--yellow);border-radius:24px;padding:14px 12px 14px 18px;display:flex;justify-content:space-between;align-items:center;border:none;text-align:left;width:100%;overflow:hidden}
.dday{color:var(--accInk)}.dday .k{display:block;font-size:12px;font-weight:700;color:var(--accInk2)}
.dday .t{display:block;font-size:21px;margin:2px 0}
.dday .d{display:block;font-size:13px;color:var(--accInk)}
.dday .n{display:block;font-size:36px;line-height:1.1;margin-top:4px}
.sec h2{margin:0 0 8px;font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 span{font-size:13px;color:var(--mute);font-family:'Noto Sans KR',sans-serif}
.list{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:none;border-bottom:2px dashed var(--dash);background:transparent;width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row .tm{font-size:14px;font-weight:700;width:44px;flex:none}
.row .dy{width:44px;flex:none;text-align:center}.row .dy small{display:block;font-size:11px;color:var(--mute)}.row .dy b{font-size:18px;font-family:var(--hfont);font-weight:var(--hweight)}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx small{font-size:12px;color:var(--mute)}
.cc{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--mute);flex:none}
.empty{padding:20px 16px;color:var(--mute);font-size:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:66px;align-items:center}
nav.tabs button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mute);font-weight:500}
nav.tabs button.on{color:var(--main);font-weight:700}
nav.tabs button{position:relative;height:100%}
nav.tabs .plus{width:58px;height:58px;border-radius:29px;background:var(--main);color:var(--onmain);margin:-22px auto 0;box-shadow:0 4px 0 var(--main2);height:58px;flex:none;align-self:start;justify-self:center;font-size:0}
.bdg{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--badge);color:#fff;font-size:11px;font-weight:800;line-height:18px;padding:0 5px;text-align:center}
.bell{position:relative}.bell .bdg{top:-4px;left:auto;right:-4px}
.news{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:2px dashed var(--dash);background:transparent;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.news:last-child{border-bottom:none}.news.new{background:color-mix(in srgb,var(--main) 8%,transparent)}
.news b{font-size:14px}.news small{display:block;font-size:12px;color:var(--mute)}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.themes button{border:2px solid var(--line2);background:var(--card);border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink)}
.themes button.on{border-color:var(--main);box-shadow:0 0 0 2px var(--main) inset}
.themes i{width:34px;height:34px;border-radius:17px;display:block;border:2px solid rgba(0,0,0,.08)}
.range{display:inline-block;font-size:11px;font-weight:700;color:var(--main);background:color-mix(in srgb,var(--main) 12%,transparent);border-radius:6px;padding:0 5px;margin-left:4px}
input[type=date].in1,input[type=time].in1{-webkit-appearance:none;appearance:none;display:flex;align-items:center;min-height:52px;line-height:52px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
.cal{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:10px 4px 8px}
.cal .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .w{text-align:center;font-size:12px;font-weight:700;color:var(--mute);padding-bottom:6px}
.cal .c{height:54px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:3px}
.cal .c .nm{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:16px;font-family:var(--hfont);font-weight:var(--hweight)}
.cal .c.out .nm{color:var(--faint)}
.cal .c.td .nm{box-shadow:inset 0 0 0 2px var(--main)}
.cal .c.sel .nm{background:var(--main);color:var(--onmain);box-shadow:none}
.cal .ds{display:flex;gap:3px;height:7px}.cal .ds i{width:7px;height:7px;border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 4px;font-size:12px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:5px}
.form{display:flex;flex-direction:column;gap:18px}
.f label,.f .lb{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.f .lb em{font-style:normal;font-weight:400;color:var(--mute)}
.in1{width:100%;height:52px;border-radius:18px;border:2px solid var(--line2);background:var(--card);padding:0 14px}
.in1:focus{outline:none;border-color:var(--main)}
textarea.in1{height:84px;padding:12px 14px;resize:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;gap:8px}
.seg button{height:48px;border-radius:16px;border:2px solid var(--line2);background:var(--card);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;gap:12px}
.toggle b{display:block;font-size:15px;font-weight:700}.toggle small{font-size:12px;color:var(--mute)}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:15px;background:var(--line2);pointer-events:none;transition:.15s}
.sw span:after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:11px;background:#fff;transition:.15s}
.sw input:checked+span{background:var(--main)}.sw input:checked+span:after{left:26px}
.sw input:focus-visible+span{outline:2px solid var(--main);outline-offset:2px}
.btn{height:56px;border-radius:28px;border:none;background:var(--main);color:var(--onmain);font-size:19px;width:100%;box-shadow:0 5px 0 var(--main2);font-family:var(--hfont);font-weight:var(--hweight)}
.btn.ghost{background:var(--card);color:var(--danger);border:2px solid var(--line2);font-size:15px;height:48px;box-shadow:none;font-family:'Noto Sans KR',sans-serif;font-weight:700}
.btn.line{background:var(--card);color:var(--ink);border:2px solid var(--line2);font-size:15px;height:48px;box-shadow:none;font-family:'Noto Sans KR',sans-serif;font-weight:700}
.subtop{padding:14px 8px 4px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center}
.subtop h1{margin:0;font-size:20px;text-align:center}
.subtop button{height:44px;border:none;background:transparent;font-size:15px;color:var(--mute);display:flex;align-items:center;justify-content:center}
.subtop button.go{color:var(--main);font-weight:700}
.todo-add{display:flex;gap:8px}
.todo-add input{flex:1}
.todo-add button{width:64px;border-radius:18px;border:none;background:var(--main);color:var(--onmain);font-weight:700}
.trow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-bottom:2px dashed var(--dash)}
.trow:last-child{border-bottom:none}
.trow label{flex:1;display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;cursor:pointer;min-width:0}
.trow input[type=checkbox]{width:22px;height:22px;accent-color:var(--main);flex:none}
.trow.done label span{text-decoration:line-through;color:var(--mute)}
.trow small{font-size:12px;color:var(--mute);display:block}
.join{padding:0 24px 40px;display:flex;flex-direction:column;gap:18px;max-width:520px;margin:0 auto}
.hill{position:relative;height:250px;margin:0 -24px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.hill:before{content:'';position:absolute;left:-40px;right:-40px;bottom:-70px;height:140px;border-radius:50%;background:var(--hill)}
.hill .sun{position:absolute;top:30px;left:36px;width:44px;height:44px;border-radius:22px;background:var(--yellow)}
.hill .grp{position:relative;display:flex;align-items:flex-end;margin-bottom:14px}
.join h1{margin:0;text-align:center;font-size:30px}
.join p.lead{margin:0;text-align:center;color:var(--mute);font-size:15px;line-height:1.6}
.tip{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:13px;color:var(--sub);line-height:1.6}
.tail{text-align:center}.tail b{display:block;font-size:32px;letter-spacing:6px;color:var(--ink);font-family:'Jua',sans-serif;font-weight:400}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px}
.card h3{margin:0 0 8px;font-size:17px}
.card p{margin:0;font-size:14px;color:var(--sub);line-height:1.6}
.evcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.evcard h2{margin:0;font-size:22px}
.pill{height:32px;padding:0 10px 0 2px;border-radius:16px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.memo{margin:0;padding:10px 12px;background:var(--bg);border-radius:14px;font-size:14px;white-space:pre-wrap}
.cm{display:flex;gap:10px;align-items:flex-start}
.cm .bub{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:6px 18px 18px 18px;padding:8px 12px}
.cm .bub .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cm .bub .h b{font-size:13px}.cm .bub .h span{font-size:11px;color:var(--mute)}
.cm .bub p{margin:2px 0 0;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.cm .del{border:none;background:transparent;color:var(--mute);font-size:12px;padding:6px 0 0;min-height:24px}
.cbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);z-index:6;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.cbar form{max-width:496px;margin:0 auto;display:flex;gap:8px;align-items:center;position:relative}
.cbar input{flex:1;height:48px;border-radius:24px;border:2px solid var(--line2);background:var(--bg);padding:0 16px;font-size:16px;min-width:0}
.cbar input:focus{outline:none;border-color:var(--main)}
.cbar button{width:48px;height:48px;border-radius:24px;border:none;background:var(--main);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 0 var(--main2)}
.cbar .sit{position:absolute;right:6px;top:-58px;pointer-events:none}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.loading{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--main) 40%,transparent 40%);background-size:200% 100%;animation:ld 1s linear infinite;z-index:30}
@keyframes ld{from{background-position:100% 0}to{background-position:-100% 0}}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pick button{border:2px solid var(--line2);background:var(--card);border-radius:18px;padding:6px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;font-weight:700;color:var(--ink)}
.pick button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.sw8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;padding:3px}
.sw8 button{width:100%;aspect-ratio:1/1;height:auto;min-height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line2);padding:0}
.sw8 button.on{box-shadow:0 0 0 3px var(--ink)}
.preview{display:flex;flex-direction:column;align-items:center;gap:2px;padding:20px 0 0}
.preview b{font-size:22px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top h1{white-space:nowrap;font-size:clamp(22px,6.6vw,28px)}header.top>div:first-child{min-width:0}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:8px}
.wd button{height:40px;border-radius:12px;border:2px solid var(--line2);background:var(--card);font-weight:700;font-size:14px;color:var(--ink)}
.wd button.on{background:var(--main);border-color:var(--main);color:var(--onmain)}
.hchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--sun);background:color-mix(in srgb,var(--sun) 12%,transparent);border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:middle;font-family:'Noto Sans KR',sans-serif}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px dashed var(--dash);color:var(--sun);font-weight:700;font-size:14px}
.hrow .dy{width:44px;text-align:center}.hrow .dy small{display:block;font-size:11px;font-weight:500}.hrow .dy b{font-size:18px;font-family:var(--hfont);font-weight:var(--hweight)}
.skipbtn{background:transparent;border:2px dashed var(--line2);border-radius:14px;height:44px;font-weight:700;color:var(--mute);width:100%}
.sub2{font-size:12px;color:var(--mute);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sub2 button{border:none;background:none;color:var(--main);font-weight:700;padding:0;font-size:12px}
</style>
</head>

<script>
(function () {
  'use strict';
  var APP_VER = '1.9.0';
  var THEMES = [['dino', '공룡 숲', '#2F7A4A', '#FFF8EC'], ['sea', '바다', '#1F6FA8', '#EEF6FB'], ['berry', '딸기우유', '#C93D6F', '#FFF4F6'], ['night', '밤하늘', '#4FB37C', '#12161E'], ['clean', '깔끔한 흰색', '#2F5DA8', '#F6F7F9']];
  function applyTheme(t) {
    if (!THEMES.some(function (x) { return x[0] === t; })) t = 'dino';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', THEMES.filter(function (x) { return x[0] === t; })[0][2]);
    return t;
  }
  // 휴대폰 앱(GitHub Pages)에서 쓸 때만: Apps Script 웹 앱 주소(…/exec). Apps Script 안에서 열면 쓰지 않아요.
  var API_URL = window.FAMCAL_API_URL || '';
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var REPEATS = ['안 함', '매일', '매주', '격주', '매월', '매년'];
  var S = {
    code: store('fc_code') || '', me: '', dev: devId(),
    data: null, stage: '', joinMembers: [], reqName: '', reqMemo: '', reqKind: 'rex', reqColor: '#3F78E0', pick: null,
    view: 'home', filter: '전체', calY: 0, calM: 0, sel: '', edit: null, detail: '',
    todoKind: '할 일', lastLoad: 0, back: 'home', toBottom: false

  document.addEventListener('click', function (ev) {

      case 'logout':
        if (!confirm('이 기기에서 나갈까요? 다시 쓰려면 가족 코드를 넣고 새로 승인받아야 해요.')) return;
        call('apiLogout', S.code, S.dev).catch(function () {}).then(function () {
          forget(false); store('fc_dev', null); S.dev = devId(); S.stage = ''; S.view = 'home'; render(); toast('나갔어요');
        });
        break;
    }
  });

  document.addEventListener('submit', function (ev) {
    var id = ev.target.id;
    if (id === 'reqform') {
      ev.preventDefault();
      S.reqMemo = document.getElementById('r_memo').value.trim();
      S.reqName = document.getElementById('r_name').value.replace(/[,<>"'=+@\-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 10);
      if (!S.reqName) { toast('내 이름을 적어 주세요.'); return; }
      if (S.reqName === '가족' || S.reqName === '전체') { toast('\'' + S.reqName + '\'은(는) 이름으로 쓸 수 없어요.'); return; }
      if (S.reqMemo.replace(/\s/g, '').length < 2) { toast('어떤 기기로 신청하는지 적어 주세요.'); return; }
      call('apiRequest', S.code, S.dev, S.reqName, uaText(), S.reqMemo, S.reqKind, S.reqColor).then(function (r) {
        if (r.status === 'Y') return load();
        if (r.status === 'N') { forget(false); S.stage = ''; render(); toast('이 기기는 사용이 막혀 있어요.'); return; }
        S.stage = 'wait'; render(); toast('승인 요청을 보냈어요');
      }).catch(fail);
      return;
    }
    if (id === 'cform') {
      ev.preventDefault();
      var inp = document.getElementById('c_text'), text = inp.value.trim();
      if (!text) return;
      var evId = S.detail;
      if (/^tmp/.test(evId)) { toast('일정 저장이 끝나면 댓글을 달 수 있어요.'); return; }
      inp.value = ''; S.toBottom = true;
      quick(function (D) { D.comments.push({ id: tmpId(), eventId: evId, name: S.me, text: text, at: nowStamp(), mine: true }); }, 'apiAddComment', [S.code, S.dev, evId, text],
        function () { setTimeout(function () { var i2 = document.getElementById('c_text'); if (i2 && !i2.value) i2.value = text; }, 0); });
      return;
    }
    if (id === 'todoform') {
      ev.preventDefault();
      var t = document.getElementById('t_text'), tx = t.value.trim();
      if (!tx) return;
      var tk = S.todoKind;
      quick(function (D) { D.todos.push({ id: tmpId(), kind: tk, text: tx, who: '', done: false, by: S.me, at: nowStamp() }); }, 'apiSaveTodo', [S.code, S.dev, { kind: tk, text: tx }]);
      var i2 = document.getElementById('t_text'); if (i2) i2.focus();
    }
  });

  // 다시 화면에 돌아오면(1분 지났을 때) 새로 불러오기, 일정 화면을 보고 있으면 30초마다 댓글 새로고침
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.code && S.data && Date.now() - S.lastLoad > 60000 && S.view !== 'edit') load(true);
  });
  // 바뀐 게 있는지 가볍게 확인: 일정(댓글) 화면은 4초, 다른 화면은 20초마다. 바뀌었을 때만 새로 받아 옴
  var lastPing = 0, pinging = false;
  setInterval(function () {
    if (document.visibilityState !== 'visible' || !S.code || !S.data || pinging || pending || S.view === 'edit') return;
    var gap = S.view === 'detail' ? 4000 : 20000;
    if (Date.now() - lastPing < gap || Date.now() - S.lastLoad < gap) return;
    lastPing = Date.now(); pinging = true;
    callQuiet('apiPing', S.code, S.dev).then(function (r) {
      pinging = false;
      if (r && r.rev && S.data && r.rev !== S.data.rev) load(true);
    }, function (e) { pinging = false; authFail(e); });
  }, 1000);

  render();
  if (S.code) load(true);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
