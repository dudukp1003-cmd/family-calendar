<!DOCTYPE html>
<html lang="ko">
<head>
<title>우리가족 캘린더</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F7A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가족 캘린더">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EC;--card:#FFFFFF;--ink:#2B2A33;--mute:#5F5B66;--line:#F1E6CF;--line2:#E9DCC1;--dash:#F3EAD8;--main:#2F7A4A;--main2:#225C37;--sun:#C2410C;--sat:#2F6FDB;--yellow:#FFE08A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif}
button,input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{padding:22px 20px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.top small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.top h1{margin:0;font-size:27px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:2px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn.plain{border:none;background:transparent}
.chips{display:flex;gap:6px;padding:8px 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 12px 0 5px;border-radius:20px;border:2px solid var(--line2);background:var(--card);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip.all{padding:0 16px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
main{flex:1;padding:0 16px 120px;display:flex;flex-direction:column;gap:14px}
.dday{background:var(--yellow);border-radius:24px;padding:14px 12px 14px 18px;display:flex;justify-content:space-between;align-items:center;border:none;text-align:left;width:100%;overflow:hidden}
.dday .k{display:block;font-size:12px;font-weight:700;color:#6B4E00}
.dday .t{display:block;font-size:21px;margin:2px 0}
.dday .d{display:block;font-size:13px;color:#4A3A10}
.dday .n{display:block;font-size:36px;line-height:1.1;margin-top:4px}
.sec h2{margin:0 0 8px;font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 span{font-size:13px;color:var(--mute);font-family:'Noto Sans KR',sans-serif}
.list{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:none;border-bottom:2px dashed var(--dash);background:transparent;width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row .tm{font-size:14px;font-weight:700;width:44px;flex:none}
.row .dy{width:44px;flex:none;text-align:center}.row .dy small{display:block;font-size:11px;color:var(--mute)}.row .dy b{font-size:18px;font-family:'Jua',sans-serif;font-weight:400}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx small{font-size:12px;color:var(--mute)}
.cc{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--mute);flex:none}
.empty{padding:20px 16px;color:var(--mute);font-size:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:92px;width:60px;height:60px;border-radius:30px;background:var(--main);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--main2);z-index:5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:68px}
nav.tabs button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mute);font-weight:500}
nav.tabs button.on{color:var(--main);font-weight:700}
.cal{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:10px 4px 8px}
.cal .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .w{text-align:center;font-size:12px;font-weight:700;color:var(--mute);padding-bottom:6px}
.cal .c{height:54px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:3px}
.cal .c .nm{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:16px;font-family:'Jua',sans-serif}
.cal .c.out .nm{color:#B8B2A7}
.cal .c.td .nm{box-shadow:inset 0 0 0 2px var(--main)}
.cal .c.sel .nm{background:var(--main);color:#fff;box-shadow:none}
.cal .ds{display:flex;gap:3px;height:7px}.cal .ds i{width:7px;height:7px;border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 4px;font-size:12px;color:#4A4652}
.legend span{display:flex;align-items:center;gap:5px}
.form{display:flex;flex-direction:column;gap:18px}
.f label,.f .lb{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.f .lb em{font-style:normal;font-weight:400;color:var(--mute)}
.in1{width:100%;height:52px;border-radius:18px;border:2px solid var(--line2);background:var(--card);padding:0 14px}
.in1:focus{outline:none;border-color:var(--main)}
textarea.in1{height:84px;padding:12px 14px;resize:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;gap:8px}
.seg button{height:48px;border-radius:16px;border:2px solid var(--line2);background:var(--card);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;gap:12px}
.toggle b{display:block;font-size:15px;font-weight:700}.toggle small{font-size:12px;color:var(--mute)}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:15px;background:var(--line2);pointer-events:none;transition:.15s}
.sw span:after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:11px;background:#fff;transition:.15s}
.sw input:checked+span{background:var(--main)}.sw input:checked+span:after{left:26px}
.sw input:focus-visible+span{outline:2px solid var(--main);outline-offset:2px}
.btn{height:56px;border-radius:28px;border:none;background:var(--main);color:#fff;font-size:19px;width:100%;box-shadow:0 5px 0 var(--main2);font-family:'Jua','Noto Sans KR',sans-serif}
.btn.ghost{background:var(--card);color:#B42318;border:2px solid var(--line2);font-size:15px;height:48px;box-shadow:none;font-family:'Noto Sans KR',sans-serif;font-weight:700}
.btn.line{background:var(--card);color:var(--ink);border:2px solid var(--line2);font-size:15px;height:48px;box-shadow:none;font-family:'Noto Sans KR',sans-serif;font-weight:700}
.subtop{padding:14px 8px 4px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center}
.subtop h1{margin:0;font-size:20px;text-align:center}
.subtop button{height:44px;border:none;background:transparent;font-size:15px;color:var(--mute);display:flex;align-items:center;justify-content:center}
.subtop button.go{color:var(--main);font-weight:700}
.todo-add{display:flex;gap:8px}
.todo-add input{flex:1}
.todo-add button{width:64px;border-radius:18px;border:none;background:var(--main);color:#fff;font-weight:700}
.trow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-bottom:2px dashed var(--dash)}
.trow:last-child{border-bottom:none}
.trow label{flex:1;display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;cursor:pointer;min-width:0}
.trow input[type=checkbox]{width:22px;height:22px;accent-color:var(--main);flex:none}
.trow.done label span{text-decoration:line-through;color:var(--mute)}
.trow small{font-size:12px;color:var(--mute);display:block}
.join{padding:0 24px 40px;display:flex;flex-direction:column;gap:18px;max-width:520px;margin:0 auto}
.hill{position:relative;height:250px;margin:0 -24px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.hill:before{content:'';position:absolute;left:-40px;right:-40px;bottom:-70px;height:140px;border-radius:50%;background:#CDEBC4}
.hill .sun{position:absolute;top:30px;left:36px;width:44px;height:44px;border-radius:22px;background:var(--yellow)}
.hill .grp{position:relative;display:flex;align-items:flex-end;margin-bottom:14px}
.join h1{margin:0;text-align:center;font-size:30px}
.join p.lead{margin:0;text-align:center;color:var(--mute);font-size:15px;line-height:1.6}
.tip{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:13px;color:#4A4652;line-height:1.6}
.tail{text-align:center}.tail b{display:block;font-size:32px;letter-spacing:6px;color:var(--ink);font-family:'Jua',sans-serif;font-weight:400}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px}
.card h3{margin:0 0 8px;font-size:17px}
.card p{margin:0;font-size:14px;color:#4A4652;line-height:1.6}
.evcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.evcard h2{margin:0;font-size:22px}
.pill{height:32px;padding:0 10px 0 2px;border-radius:16px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.memo{margin:0;padding:10px 12px;background:var(--bg);border-radius:14px;font-size:14px;white-space:pre-wrap}
.cm{display:flex;gap:10px;align-items:flex-start}
.cm .bub{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:6px 18px 18px 18px;padding:8px 12px}
.cm .bub .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cm .bub .h b{font-size:13px}.cm .bub .h span{font-size:11px;color:var(--mute)}
.cm .bub p{margin:2px 0 0;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.cm .del{border:none;background:transparent;color:var(--mute);font-size:12px;padding:6px 0 0;min-height:24px}
.cbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);z-index:6;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.cbar form{max-width:496px;margin:0 auto;display:flex;gap:8px;align-items:center;position:relative}
.cbar input{flex:1;height:48px;border-radius:24px;border:2px solid var(--line2);background:var(--bg);padding:0 16px;font-size:16px;min-width:0}
.cbar input:focus{outline:none;border-color:var(--main)}
.cbar button{width:48px;height:48px;border-radius:24px;border:none;background:var(--main);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 0 var(--main2)}
.cbar .sit{position:absolute;right:6px;top:-58px;pointer-events:none}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.loading{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--main) 40%,transparent 40%);background-size:200% 100%;animation:ld 1s linear infinite;z-index:30}
@keyframes ld{from{background-position:100% 0}to{background-position:-100% 0}}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pick button{border:2px solid var(--line2);background:var(--card);border-radius:18px;padding:6px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;font-weight:700;color:var(--ink)}
.pick button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.sw8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;padding:3px}
.sw8 button{width:100%;aspect-ratio:1/1;height:auto;min-height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line2);padding:0}
.sw8 button.on{box-shadow:0 0 0 3px var(--ink)}
.preview{display:flex;flex-direction:column;align-items:center;gap:2px;padding:20px 0 0}
.preview b{font-size:22px}
.ph{position:relative;border-radius:24px;overflow:hidden;background:#F1E6CF}
.ph-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ph-track::-webkit-scrollbar{display:none}
.ph-slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center}
.ph-slide img{width:100%;height:100%;object-fit:cover;display:block}
.ph-cap{position:absolute;left:12px;bottom:12px;background:rgba(43,42,51,.72);color:#fff;font-size:12px;padding:5px 10px;border-radius:12px}
.ph-dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.ph-dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.6)}
.ph-dots i.on{background:#fff;width:18px}
.ph-btn{position:absolute;right:10px;top:10px;height:36px;padding:0 12px;border-radius:18px;border:none;background:rgba(255,255,255,.92);font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.ph-empty{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line2);background:var(--card);border-radius:24px;width:100%;font-size:14px;color:var(--mute)}
.ph-load{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.ph-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph-grid .it{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1/1;background:#F1E6CF}
.ph-grid .it img{width:100%;height:100%;object-fit:cover;display:block}
.ph-grid .it .meta{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:11px;display:flex;justify-content:space-between;align-items:center}
.ph-grid .it .meta button{border:none;background:rgba(255,255,255,.92);color:#B42318;font-size:12px;font-weight:700;border-radius:12px;height:30px;padding:0 10px}
.upl{position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

  }

  function renderJoin() {
    app.innerHTML = '<div class="join">' + joinHead('우리가족 캘린더', '공룡 가족이 함께 쓰는 일정표예요.<br>받은 가족 코드를 입력해 주세요.') +
      '<form id="joinform" style="display:flex;flex-direction:column;gap:16px"><div class="f"><label for="j_code">가족 코드</label>' +
      '<input class="in1" id="j_code" inputmode="numeric" autocomplete="off" maxlength="20" style="font-size:18px;letter-spacing:3px" placeholder="6자리 코드"></div>' +
      '<button class="btn" type="submit">다음</button></form>' +
      '<div class="tip">처음 쓰는 기기는 관리자가 승인해야 들어갈 수 있어요. 가족 코드를 알아도 승인 없이는 일정이 보이지 않아요.</div></div>';
    document.getElementById('joinform').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var code = document.getElementById('j_code').value.trim();
      if (!code) { toast('가족 코드를 입력해 주세요.'); return; }
      call('apiCheck', code).then(function (r) {
        S.code = code; store('fc_code', code); S.joinMembers = r.members;
        return call('apiLoad', code, S.dev).then(function (d) { setData(d); render(); });
      }).catch(function (e) {
        if (e.kind === 'E_CODE' || e.kind === 'E_LOCK') { toast(e.message); return; }
        fail(e);
      });
    });
  }

  function renderWho() {
    var list = (S.joinMembers || []).filter(function (m) { return m.name !== '가족'; });
    app.innerHTML = '<div class="join">' + joinHead('승인 요청하기', '이름과 캐릭터를 고르면 관리자에게 승인 요청이 가요.', preview(S.reqKind, S.reqColor, S.reqName)) +
      '<form id="reqform" class="form" novalidate>' +
      '<div class="f"><label for="r_name">내 이름 <span style="font-weight:400;color:var(--mute)">(가족이 부르는 이름)</span></label>' +
      '<input class="in1" id="r_name" maxlength="10" autocomplete="off" value="' + esc(S.reqName) + '" placeholder="예: 아빠, 할머니, 지우">' +
      (list.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" role="group" aria-label="이미 있는 이름 고르기"><span style="font-size:12px;color:var(--mute);align-self:center">이미 있는 이름:</span>' +
        list.map(function (m) { return '<button type="button" class="chip" data-req="' + esc(m.name) + '" style="height:36px">' + head(m.name, 26) + esc(m.name) + '</button>'; }).join('') + '</div>' : '') +
      '</div>' + picker(S.reqKind, S.reqColor) +
      '<div class="f"><label for="r_memo">어떤 기기로 신청하나요?</label>' +
      '<input class="in1" id="r_memo" maxlength="40" autocomplete="off" value="' + esc(S.reqMemo) + '" placeholder="예: 새로 바꾼 아이폰"></div>' +
      '<div class="tip tail">이 기기의 확인 번호 · 관리자가 물어보면 알려 주세요<b>' + tail() + '</b></div>' +
      '<button class="btn" type="submit">승인 요청 보내기</button>' +
      '<button class="btn line" type="button" data-act="restart">처음으로</button></form></div>';
  }

  function renderChar() {
    var p = S.pick;
    return '<div class="subtop"><button data-act="charcancel">취소</button><h1 class="jua">내 캐릭터</h1><span></span></div><main>' +
      preview(p.kind, p.color, S.me) + '<div class="form">' + picker(p.kind, p.color) +
      '<button class="btn" type="button" data-act="charsave">이 캐릭터로 바꾸기</button>' +
      '<p style="margin:0;font-size:12px;color:var(--mute);text-align:center">바꾸면 가족 모두의 화면에서 내 공룡이 바뀌어요.</p></div></main>';
  }

  function renderWait() {
    app.innerHTML = '<div class="join">' + joinHead('승인을 기다리고 있어요', '관리자가 구글 시트 \'기기\' 탭에서<br>이 기기를 승인하면 들어갈 수 있어요.', S.reqName ? preview(S.reqKind, S.reqColor, S.reqName) : '') +
      '<div class="tip tail">확인 번호 · 관리자에게 이 4자리를 알려 주세요<b>' + tail() + '</b></div>' +
      '<div class="tip">이 기기: ' + esc(uaText()) + '</div>' +
      '<button class="btn" data-act="checkwait">승인됐는지 확인</button>' +
      '<button class="btn line" data-act="restart">처음으로</button></div>';
  }

  function renderLoading() {
    app.innerHTML = '<div class="join">' + joinHead('우리가족 캘린더', '일정을 불러오는 중이에요…') + '</div>';
  }

  /* ── 클릭 처리 (한 곳에서) ── */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button,input[type=checkbox]');
    if (!b) return;
    var ds = b.dataset;
    if (ds.tab) { S.view = ds.tab; render(); return; }
    if (ds.filter) { S.filter = ds.filter; render(true); return; }
    if (ds.req) { var rn = document.getElementById('r_name'); if (rn) { rn.value = ds.req; rn.focus(); } return; }
    if (ds.ck || ds.cc) {
      if (S.view === 'char' && S.pick && S.code && S.data && !S.stage) {
        if (ds.ck) S.pick.kind = ds.ck; else S.pick.color = ds.cc;
        render(true); return;
      }
      var n1 = document.getElementById('r_name'), m1 = document.getElementById('r_memo');
      if (n1) S.reqName = n1.value.trim(); if (m1) S.reqMemo = m1.value;
      if (ds.ck) S.reqKind = ds.ck; else S.reqColor = ds.cc;
      var y0 = window.scrollY; renderWho(); window.scrollTo(0, y0); return;
    }
    if (ds.day) { S.sel = ds.day; render(true); return; }
    if (ds.ev) { S.back = S.view; S.detail = ds.ev; S.view = 'detail'; render(); return; }
    if (ds.who) {
      keepForm();
      var w = whoList(S.edit), i = w.indexOf(ds.who);
      if (i >= 0) w.splice(i, 1); else w.push(ds.who);
      S.edit.who = w.join(','); app.innerHTML = renderEdit(); bindEdit(); return;
    }
    if (ds.rep) { keepForm(); S.edit.repeat = ds.rep; app.innerHTML = renderEdit(); bindEdit(); return; }
    if (ds.kind) { S.todoKind = ds.kind; render(); return; }
    if (ds.toggle) { call('apiToggleTodo', S.code, S.dev, ds.toggle).then(function (d) { setData(d); render(true); }).catch(function (e) { fail(e); render(true); }); return; }
    if (ds.deltodo) { call('apiDeleteTodo', S.code, S.dev, ds.deltodo).then(function (d) { setData(d); render(true); }).catch(fail); return; }
    if (ds.delph) {
      if (!confirm('이 사진을 지울까요? 가족 모두의 화면에서 사라지고, 드라이브 휴지통에서 30일 안에 되살릴 수 있어요.')) return;
      call('apiDeletePhoto', S.code, S.dev, ds.delph).then(function (d) { delete S.photoData[ds.delph]; S.photoIdx = 0; setData(d); render(true); toast('지웠어요'); }).catch(fail);
      return;
    }
    if (ds.delcm) {
      if (!confirm('이 댓글을 지울까요?')) return;
      call('apiDeleteComment', S.code, S.dev, ds.delcm).then(function (d) { setData(d); render(true); }).catch(fail);
      return;
    }
    switch (ds.act) {
      case 'new':
        S.editBack = S.view;
        S.edit = { id: '', title: '', date: S.view === 'cal' ? S.sel : today(), time: '', who: S.me || '', repeat: '안 함', dday: 'N', memo: '' };
        S.view = 'edit'; render(); setTimeout(function () { var t = document.getElementById('f_title'); if (t) t.focus(); }, 50); break;
      case 'editev':
        var e0 = events().filter(function (x) { return x.id === S.detail; })[0];
        if (e0) { S.editBack = 'detail'; S.edit = JSON.parse(JSON.stringify(e0)); S.view = 'edit'; render(); }
        break;
      case 'back': S.view = S.back || 'home'; render(); break;
      case 'photos': S.phBack = S.view; S.view = 'photos'; render(); break;
      case 'phback': S.view = S.phBack || 'home'; render(); break;
      case 'char':
        var mm0 = memberOf(S.me);
        S.pick = { kind: kindOf(S.me), color: (mm0 && COLORS.some(function (c) { return c.c === mm0.color.toUpperCase(); })) ? mm0.color.toUpperCase() : COLORS[0].c };
        S.view = 'char'; render(); break;
      case 'charcancel': S.view = 'set'; S.pick = null; render(); break;
      case 'charsave':
        call('apiSetCharacter', S.code, S.dev, S.pick.kind, S.pick.color).then(function (d) { setData(d); S.view = 'set'; S.pick = null; render(); toast('캐릭터를 바꿨어요'); }).catch(fail);
        break;
      case 'cancel': S.view = S.editBack || 'home'; S.edit = null; render(); break;
      case 'delete':
        if (!confirm('이 일정을 지울까요? 달린 댓글도 함께 지워지고, 가족 모두의 화면에서 사라져요.')) return;
        call('apiDeleteEvent', S.code, S.dev, S.edit.id).then(function (d) { setData(d); S.view = (S.editBack === 'detail' ? S.back : S.editBack) || 'home'; S.edit = null; render(); toast('지웠어요'); }).catch(fail);
        break;
      case 'refresh': load().then(function () { if (S.data) toast('새로 불러왔어요'); }); break;
      case 'prev': S.calM--; if (S.calM < 0) { S.calM = 11; S.calY--; } render(true); break;
      case 'next': S.calM++; if (S.calM > 11) { S.calM = 0; S.calY++; } render(true); break;
      case 'today': var n = new Date(); S.calY = n.getFullYear(); S.calM = n.getMonth(); S.sel = today(); render(true); break;
      case 'cleardone': call('apiClearDone', S.code, S.dev, S.todoKind).then(function (d) { setData(d); render(true); }).catch(fail); break;
      case 'restart': forget(false); S.stage = ''; render(); break;
      case 'checkwait': load().then(function () { if (S.stage === 'wait') toast('아직 승인 전이에요'); }); break;
      case 'logout':
        if (!confirm('이 기기에서 나갈까요? 다시 쓰려면 가족 코드를 넣고 새로 승인받아야 해요.')) return;
        call('apiLogout', S.code, S.dev).catch(function () {}).then(function () {
          forget(false); store('fc_dev', null); S.dev = devId(); S.stage = ''; S.view = 'home'; render(); toast('나갔어요');
        });
        break;
    }
  });

  document.addEventListener('change', function (ev) {
    if (ev.target.id !== 'phFile' || !ev.target.files || !ev.target.files[0]) return;
    var f = ev.target.files[0];
    if (!/^image\//.test(f.type || 'image/')) { toast('사진 파일만 올릴 수 있어요.'); return; }
    toast('사진을 줄이는 중…');
    shrink(f).then(function (dataUrl) {
      return call('apiUploadPhoto', S.code, S.dev, dataUrl).then(function (d) {
        var ids = photos().map(function (p) { return p.id; });
        setData(d);
        var added = photos().filter(function (p) { return ids.indexOf(p.id) < 0; })[0];
        if (added) S.photoData[added.id] = dataUrl;
        S.photoIdx = Math.max(0, photos().length - 1);
        render(true); toast('사진을 올렸어요');
      });
    }).catch(fail);
  });

  document.addEventListener('submit', function (ev) {
    var id = ev.target.id;
    if (id === 'reqform') {
      ev.preventDefault();
      S.reqMemo = document.getElementById('r_memo').value.trim();
      S.reqName = document.getElementById('r_name').value.replace(/[,<>"'=+@\-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 10);
      if (!S.reqName) { toast('내 이름을 적어 주세요.'); return; }
      if (S.reqName === '가족' || S.reqName === '전체') { toast('\'' + S.reqName + '\'은(는) 이름으로 쓸 수 없어요.'); return; }
      if (S.reqMemo.replace(/\s/g, '').length < 2) { toast('어떤 기기로 신청하는지 적어 주세요.'); return; }
      call('apiRequest', S.code, S.dev, S.reqName, uaText(), S.reqMemo, S.reqKind, S.reqColor).then(function (r) {
        if (r.status === 'Y') return load();
        if (r.status === 'N') { forget(false); S.stage = ''; render(); toast('이 기기는 사용이 막혀 있어요.'); return; }
        S.stage = 'wait'; render(); toast('승인 요청을 보냈어요');
      }).catch(fail);
      return;
    }
    if (id === 'cform') {
      ev.preventDefault();
      var inp = document.getElementById('c_text'), text = inp.value.trim();
      if (!text) return;
      inp.disabled = true;
      call('apiAddComment', S.code, S.dev, S.detail, text).then(function (d) {
        setData(d); S.toBottom = true; render();
      }).catch(function (e) { inp.disabled = false; fail(e); });
      return;
    }
    if (id === 'todoform') {
      ev.preventDefault();
      var t = document.getElementById('t_text'), tx = t.value.trim();
      if (!tx) return;
      call('apiSaveTodo', S.code, S.dev, { kind: S.todoKind, text: tx }).then(function (d) { setData(d); render(true); var i2 = document.getElementById('t_text'); if (i2) i2.focus(); }).catch(fail);
    }
  });

  // 다시 화면에 돌아오면(1분 지났을 때) 새로 불러오기, 일정 화면을 보고 있으면 30초마다 댓글 새로고침
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.code && S.data && Date.now() - S.lastLoad > 60000 && S.view !== 'edit') load(true);
  });
  setInterval(function () {
    if (document.visibilityState === 'visible' && S.view === 'detail' && S.code && S.data && Date.now() - S.lastLoad > 30000) {
      var inp = document.getElementById('c_text');
      if (inp && inp.value) return; // 쓰는 중이면 건드리지 않음
      load(true);
    }
  }, 10000);

  render();
  if (S.code) load(true);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
